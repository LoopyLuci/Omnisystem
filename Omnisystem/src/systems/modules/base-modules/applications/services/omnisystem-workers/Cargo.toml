[workspace]
members = [
    "crates/core",
    "crates/io",
    "crates/network",
    "crates/compute",
    "crates/device",
    "crates/advanced",
    "crates/integration",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Omnisystem Workers Team"]
license = "Apache-2.0"
repository = "https://github.com/omnisystem/omnisystem-workers"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
