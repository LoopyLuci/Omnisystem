[package]
name = "aether-dns-https"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1.35", features = ["net", "rt", "sync", "macros"] }
actix-web = "4.4"
actix-rt = "2.9"
actix-cors = "0.7"
aether-dns-core = { path = "../aether-dns-core" }
aether-dns-processor = { path = "../aether-dns-processor" }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
bytes = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
tokio-rustls = "0.24"
base64 = "0.21"
uuid = { version = "1.6", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"
