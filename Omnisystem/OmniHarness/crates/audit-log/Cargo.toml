[package]
name = "audit-log"
version = "1.0.0"
edition = "2021"
authors = ["Omnisystem Team"]
license = "Apache-2.0"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
blake3 = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-rusqlite = "0.8"

[lib]
name = "audit_log"
path = "src/lib.rs"

[[bin]]
name = "audit_log_cli"
path = "src/bin/cli.rs"

[dev-dependencies]


