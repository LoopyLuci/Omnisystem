[package]
autobins = false
name = "mcp-server"
version = "0.1.0"
edition = "2021"

# Marks this crate as its own workspace root so `cargo test`/`cargo check`
# work when run directly from this directory. Without it, Cargo walks up the
# directory tree looking for an ancestor `[workspace]` table and can find an
# unrelated, broken one several levels up — this crate is only ever consumed
# as a path dependency elsewhere, so declaring it standalone here is safe and
# doesn't affect how dependent crates (e.g. workspace/src-tauri) build it.
[workspace]

[[bin]]
name = "uacs"
path = "src/main.rs"

[[bin]]
name = "mcp_server_cli"
path = "src/bin/cli.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
reqwest = { version = "0.11", features = ["json"] }
lazy_static = "1.4"
capability-registry = { path = "../capability-registry" }
clap = { version = "4", features = ["derive"] }
notify-rust = "4"
chrono = { version = "0.4", features = ["serde"] }
headers = "0.4"
uuid = { version = "1.6", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
lazy_static = "1.4"
tracing = "0.1"
capability-registry = { path = "../capability-registry" }
