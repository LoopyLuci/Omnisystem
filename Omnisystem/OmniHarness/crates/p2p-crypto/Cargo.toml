[package]
autobins = false
name    = "p2p-crypto"
version = "2.0.0"
edition = "2021"
description = "Post-quantum hybrid cryptography for TransferDaemon v2"

[dependencies]
# Classical cryptography
x25519-dalek   = { version = "2", features = ["static_secrets"] }
ed25519-dalek  = { version = "2", features = ["rand_core"] }
aes-gcm        = "0.10"
blake3         = "1"
argon2         = "0.5"
rand           = "0.10"
# ed25519-dalek 2.x / x25519-dalek 2.x are still pinned to the old rand_core 0.6
# RngCore/CryptoRng traits (the `rand` crate's own rand_core moved to 0.10 with
# this bump), so OsRng for those two APIs comes from this direct rand_core 0.6
# dependency rather than from `rand::rngs`.
rand_core      = { version = "0.10", features = ["getrandom"] }
zeroize        = { version = "1", features = ["derive"] }

# BIP-39 recovery phrases
bip39          = "2"

# Serialization
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
thiserror      = "1"
hex            = "0.4"
chrono         = { version = "0.4", features = ["serde"] }

# Capability system
bitflags       = "2"

# Post-quantum (future: ml-kem, sphincsplus when available)

[dev-dependencies]
tokio          = { version = "1", features = ["full"] }

[lib]
name = "p2p_crypto"
path = "src/lib.rs"
