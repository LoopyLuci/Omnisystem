[package]
autobins = false
name    = "p2p-crypto"
version = "2.0.0"
edition = "2021"
description = "Post-quantum hybrid cryptography for TransferDaemon v2"

[dependencies]
# Classical cryptography
x25519-dalek   = { version = "3", features = ["static_secrets"] }
ed25519-dalek  = { version = "3", features = ["rand_core"] }
aes-gcm        = "0.10"
blake3         = "1"
argon2         = "0.5"
rand           = "0.10"
# x25519-dalek 3.x and ed25519-dalek 3.x both moved to rand_core 0.10's
# CryptoRng. rand_core 0.10 no longer ships an RNG itself (only traits) —
# the actual OS RNG now lives in `getrandom` 0.4 as `getrandom::SysRng`,
# which is fallible, so it's wrapped in `rand_core::UnwrapErr` wherever an
# infallible CryptoRng/Rng is required (see identity.rs, session.rs,
# kdf.rs — matching the dalek crates' own doc examples for this API).
rand_core      = "0.10"
getrandom      = "0.4"
zeroize        = { version = "1", features = ["derive"] }

# BIP-39 recovery phrases
bip39          = "2"

# Serialization
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
thiserror      = "1"
hex            = "0.4"
chrono         = { version = "0.4", features = ["serde"] }

# Capability system
bitflags       = "2"

# Post-quantum (future: ml-kem, sphincsplus when available)

[dev-dependencies]
tokio          = { version = "1", features = ["full"] }

[lib]
name = "p2p_crypto"
path = "src/lib.rs"
