[package]
autobins = false
name        = "transfer-store"
version     = "0.1.0"
edition     = "2021"
description = "Encrypted persistent store for Workspace transfer state and identity"

[dependencies]
p2p-crypto = { path = "../p2p-crypto" }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "1"
aes-gcm      = "0.10"
blake3       = "1"
argon2       = "0.5"
rand         = "0.10"
zeroize      = { version = "1", features = ["derive"] }
dirs         = "7"

[lib]
name = "transfer_store"
path = "src/lib.rs"
