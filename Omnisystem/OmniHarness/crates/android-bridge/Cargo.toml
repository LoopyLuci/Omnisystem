[package]
autobins = false
name = "android-bridge"
version = "0.1.0"
edition = "2021"
description = "Android device bridge — USB/network discovery, capability handshake, encrypted telemetry and file sync"

# Marks this crate as its own workspace root so `cargo check`/`cargo test`
# work when run directly from this directory. It cannot join the root
# workspace: Omnisystem/src/crates/android-bridge already registers a
# same-named "android-bridge" package there, and Cargo does not allow two
# workspace members with the same package name. This crate is only ever
# consumed as a path dependency elsewhere, so declaring it standalone here
# (matching the mcp-server crate's precedent) is safe.
[workspace]

[dependencies]
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
uuid        = { version = "1", features = ["v4", "serde"] }
chrono      = { version = "0.4", features = ["serde"] }
dashmap     = "5"
rand        = "0.10"
# ed25519-dalek 3.x needs rand_core 0.10's CryptoRng. rand_core 0.10 no
# longer ships an RNG itself (only traits) — the actual OS RNG now lives in
# `getrandom` 0.4 as `getrandom::SysRng`, which is fallible, so it's wrapped
# in `rand_core::UnwrapErr` to satisfy the infallible `CryptoRng` bound
# `SigningKey::generate` requires (see connection.rs, matching
# ed25519-dalek's own doc example for this API).
rand_core   = "0.10"
getrandom   = "0.4"
zeroize     = { version = "1", features = ["derive"] }
aes-gcm     = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
thiserror   = "1"
parking_lot = "0.12"
walkdir     = "2"
blake3      = "1"

[lib]
name = "android_bridge"
path = "src/lib.rs"
