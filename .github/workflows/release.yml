name: Release

# Builds real, installable artifacts on a version tag push: the Workspace
# desktop app (Tauri installer) and the VS Code extension (.vsix), attached
# to a GitHub Release. Windows-only for the Tauri build: every native
# dependency in workspace/src-tauri (audio/PTY/GPU/X11-adjacent crates) has
# only ever been built and verified on Windows in this project's history —
# publishing untested macOS/Linux installers would be a false promise, not
# "enterprise grade."
#
# The Workspace build also produces signed updater artifacts (`latest.json`
# + `.sig` files next to the installer) so `tauri-plugin-updater` in the app
# can find and verify new releases — see workspace/RELEASING.md for the two
# repo secrets this requires (TAURI_SIGNING_PRIVATE_KEY(_PASSWORD)) and what
# happens if they're missing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-workspace-app:
    name: Build Workspace desktop app (Windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Omnisystem/OmniHarness/workspace/src/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Omnisystem/OmniHarness/workspace/src-tauri -> target"
          shared-key: "workspace-release"

      - name: Install frontend dependencies
        working-directory: Omnisystem/OmniHarness/workspace/src
        run: npm ci

      - name: Build Tauri app (release installer + signed updater artifacts)
        uses: tauri-apps/tauri-action@v1
        env:
          # Ed25519 updater signing key. Required for the updater to produce
          # `latest.json` + `.sig` files — see RELEASING.md for how these two
          # secrets are generated/rotated. Absent secrets make tauri-action
          # skip signing, which would silently ship an unsigned (non-updating)
          # release, so this is a hard requirement, not an optional extra.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: Omnisystem/OmniHarness/workspace
          tagName: ${{ github.ref_name }}
          releaseName: "Workspace ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  package-vscode-extension:
    name: Package VS Code extension (.vsix)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Omnisystem/vscode-omnisystem
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Omnisystem/vscode-omnisystem/package-lock.json

      - run: npm ci
      - run: npx vsce package --out omnisystem-${{ github.ref_name }}.vsix

      - name: Attach .vsix to the release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: Omnisystem/vscode-omnisystem/omnisystem-${{ github.ref_name }}.vsix
