name: TypeScript — VS Code Extension

on:
  push:
    branches: [main, develop]
    paths:
      - "Omnisystem/vscode-omnisystem/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Omnisystem/vscode-omnisystem/**"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:

jobs:
  typecheck-lint-package:
    name: typecheck + lint + package (.vsix)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Omnisystem/vscode-omnisystem
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Omnisystem/vscode-omnisystem/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

      - name: Package .vsix
        run: npx vsce package --out omnisystem.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: omnisystem-vsix
          path: Omnisystem/vscode-omnisystem/omnisystem.vsix
          retention-days: 14

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Omnisystem/vscode-omnisystem
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - name: npm audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
