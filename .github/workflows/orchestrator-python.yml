name: Python — OmniHarness Orchestrator

on:
  push:
    branches: [main, develop]
    paths:
      - "Omnisystem/OmniHarness/orchestrator/**"
      - ".github/workflows/orchestrator-python.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Omnisystem/OmniHarness/orchestrator/**"
      - ".github/workflows/orchestrator-python.yml"
  workflow_dispatch:

jobs:
  compile-and-lint:
    name: Compile + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Omnisystem/OmniHarness/orchestrator
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Omnisystem/OmniHarness/orchestrator/requirements.txt

      - name: Install boot-critical dependencies
        # Mirrors the extension's own auto-install logic (requirements.txt
        # covers everything needed to import and boot the server — heavier
        # provider SDKs / grpc / numpy are lazy-imported, not required here).
        run: pip install -r requirements.txt

      - name: py_compile (whole package)
        run: python -m compileall -q omniharness

      - name: Import smoke test
        run: python -c "from omniharness.server import app; print('server module imports cleanly')"

      - name: Ruff (informational)
        run: |
          pip install ruff
          ruff check omniharness || true
        continue-on-error: true

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Omnisystem/OmniHarness/orchestrator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      - name: Run pip-audit (informational)
        run: pip-audit
        continue-on-error: true
