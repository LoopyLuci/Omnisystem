name: Clojure — clj-orchestrator

on:
  push:
    branches: [main, develop]
    paths:
      - "Omnisystem/OmniHarness/clj-orchestrator/**"
      - "Omnisystem/OmniHarness/proto/**"
      - ".github/workflows/clj-orchestrator.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Omnisystem/OmniHarness/clj-orchestrator/**"
      - "Omnisystem/OmniHarness/proto/**"
      - ".github/workflows/clj-orchestrator.yml"
  workflow_dispatch:

jobs:
  check:
    name: lein check (compiles the HTN planner, policy engine, HTTP API, gRPC client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Omnisystem/OmniHarness/clj-orchestrator
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          lein: "2.12.0"

      - name: Set up protoc (25.x — must match protobuf-java 3.25.x pulled in
          by grpc-protobuf 1.68.x; newer protoc emits a 4.x API that won't
          compile against it, see tools/gen-proto.sh's own header comment)
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"

      - name: Download protoc-gen-grpc-java plugin
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSLf -o "$RUNNER_TEMP/bin/protoc-gen-grpc-java" \
            https://repo1.maven.org/maven2/io/grpc/protoc-gen-grpc-java/1.68.1/protoc-gen-grpc-java-1.68.1-linux-x86_64.exe
          chmod +x "$RUNNER_TEMP/bin/protoc-gen-grpc-java"
          file "$RUNNER_TEMP/bin/protoc-gen-grpc-java"

      - name: Cache Leiningen deps
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-lein-${{ hashFiles('Omnisystem/OmniHarness/clj-orchestrator/project.clj') }}

      - name: Regenerate gRPC/protobuf Java stubs
        env:
          GRPC_JAVA_PLUGIN: ${{ runner.temp }}/bin/protoc-gen-grpc-java
        run: ./tools/gen-proto.sh

      - name: lein check
        run: lein check
