# What this project can do, as ABP operations (abp_modkit). Edit freely: adopting it again
# (`python -m abp_modkit adopt .`) keeps edited summaries, settings and ops you added, and picks up new
# routes and commands.

[service]
id = "omnisystem"
name = "Omnisystem"
description = "Omnisystem is a complete, production-grade software ecosystem designed to handle ANY situation, ANY context, ANYTHING that could be encountered over the next 100+ years of computing."
base_url = "http://127.0.0.1:9000"
health = "/health"
start = ["{target}/release/launcher-web{exe}", "--port", "9000", "--host", "127.0.0.1"]
env = { PORT = "9000" }

